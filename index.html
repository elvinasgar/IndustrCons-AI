<script>
/**
 * IndustrCons AI — API Client
 * Talks ONLY to your Cloudflare Worker Gateway. Never talk to Claude/OpenAI/
 * Groq/Gemini directly from the browser — that would expose your API keys.
 */

// 👉 STEP 1: After you deploy the Gateway (Netlify Function or Cloudflare
// Worker — see README), paste its URL here.
// Netlify Functions look like:
//   https://YOUR-SITE-NAME.netlify.app/.netlify/functions/chat
// Cloudflare Workers look like:
//   https://industrcons-gateway.<your-subdomain>.workers.dev/v1/chat
const GATEWAY_URL = "https://long-king-498d.elvinasgarov12.workers.dev/v1/chat";

const IndustrConsAPI = {
  connected: GATEWAY_URL.indexOf("REPLACE-ME") === -1,

  /**
   * Sends a user message to the Gateway and returns the assistant's reply.
   * @param {string} message
   * @param {Array} history - [{role:'user'|'assistant', content:string}, ...]
   * @param {string} lang - 'az' | 'en'
   */
  async sendMessage(message, history = [], lang = "az") {
    if (!this.connected) {
      // Local fallback so the UI is testable before the backend is deployed.
      return this._localFallback(message, lang);
    }

    try {
      const res = await fetch(GATEWAY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history, lang })
      });

      if (!res.ok) throw new Error("gateway_error_" + res.status);
      const data = await res.json();

      // Expected Gateway response shape:
      // { reply: string, action: null | { module: 'docs'|'cost-estimator'|'jobs'|'academy', url: string } }
      return data;
    } catch (err) {
      console.error("IndustrCons AI gateway error:", err);
      return {
        reply: lang === "az"
          ? "Üzr istəyirik, hazırda cavab vermək mümkün olmadı. Bir az sonra yenidən cəhd edin."
          : "Sorry, I couldn't respond right now. Please try again shortly.",
        action: null
      };
    }
  },

  /**
   * Very small demo router so the frontend is usable stand-alone before
   * the Worker is deployed. This mirrors (in miniature) the real Tool
   * Router that will live in gateway/src/tools/toolRouter.ts
   */
  _localFallback(message, lang) {
    const m = message.toLowerCase();
    const az = lang === "az";

    if (m.includes("ncr") || m.includes("uyğunsuzluq")) {
      return {
        reply: az
          ? "Bunun üçün NCR formu lazımdır. IndustrCons Docs-u açıram."
          : "You'll need an NCR form for that. Opening IndustrCons Docs.",
        action: { module: "docs", url: "https://industrconsdocs.netlify.app/" }
      };
    }
    if (m.includes("beton") || m.includes("concrete") || m.includes("m²") || m.includes("m2")) {
      return {
        reply: az
          ? "Bu iş üçün sizə Concrete Pour Card, Slump Test Form və Risk Assessment lazımdır. Cost Estimator-u açıram ki, miqdarı birlikdə hesablayaq."
          : "For this you'll need a Concrete Pour Card, Slump Test Form and Risk Assessment. Opening the Cost Estimator so we can calculate quantities together.",
        action: { module: "cost-estimator", url: "https://industrconsestimator.netlify.app/" }
      };
    }
    if (m.includes("qa") || m.includes("qc") || m.includes("şablon") || m.includes("template")) {
      return {
        reply: az
          ? "IndustrCons Docs-da uyğun QA/QC şablonunu tapıram."
          : "Looking for the right QA/QC template in IndustrCons Docs.",
        action: { module: "docs", url: "https://industrconsdocs.netlify.app/" }
      };
    }
    if (m.includes("bilik") || m.includes("knowledge") || m.includes("standart") || m.includes("bələdçi") || m.includes("guide")) {
      return {
        reply: az
          ? "IndustrCons Knowledge Center-i açıram."
          : "Opening IndustrCons Knowledge Center.",
        action: { module: "knowledge", url: "https://industrcons-knowledge-center.vercel.app/" }
      };
    }
    return {
      reply: az
        ? "Bu backend hələ qoşulmayıb (demo rejimi), amma normalda buraya AI cavabı gələcək. Cloudflare Worker-i qoşduqdan sonra tam işləyəcək."
        : "The backend isn't connected yet (demo mode) — once your Cloudflare Worker is live, a real AI answer will appear here.",
      action: null
    };
  }
};

</script>
<script>
/**
 * IndustrCons AI — Chat UI controller
 * Renders messages, calls IndustrConsAPI, and redirects to modules
 * when the Gateway/Tool Router returns an action.
 */
(function () {
  const chatLog = document.getElementById("chatLog");
  const chatForm = document.getElementById("chatForm");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const sidebar = document.getElementById("sidebar");
  const sbToggle = document.getElementById("sbToggle");
  const sbClose = document.getElementById("sbClose");
  const sbOverlay = document.getElementById("sbOverlay");
  const newChatBtn = document.getElementById("newChatBtn");
  const chatHistoryEl = document.getElementById("chatHistory");
  const sbEmpty = document.getElementById("sbEmpty");

  let currentLang = "az";
  let history = [];
  let currentChatId = null;

  // ---- Sidebar toggle (mobile) ----
  function openSidebar(){ sidebar.classList.add("open"); sbOverlay.classList.add("open"); }
  function closeSidebar(){ sidebar.classList.remove("open"); sbOverlay.classList.remove("open"); }
  sbToggle?.addEventListener("click", openSidebar);
  sbClose?.addEventListener("click", closeSidebar);
  sbOverlay?.addEventListener("click", closeSidebar);

  // ---- Chat history (stored per-browser in localStorage) ----
  function loadChats(){
    try { return JSON.parse(localStorage.getItem("industrcons_chats") || "[]"); }
    catch { return []; }
  }
  function saveChats(chats){
    try { localStorage.setItem("industrcons_chats", JSON.stringify(chats)); } catch {}
  }
  function renderHistory(){
    const chats = loadChats();
    chatHistoryEl.innerHTML = "";
    if (!chats.length) {
      const empty = document.createElement("div");
      empty.className = "sb-empty";
      empty.id = "sbEmpty";
      empty.setAttribute("data-i18n", "no_chats");
      empty.textContent = I18N[currentLang].no_chats;
      chatHistoryEl.appendChild(empty);
      return;
    }
    chats.slice().reverse().forEach(chat => {
      const btn = document.createElement("button");
      btn.className = "hist-item" + (chat.id === currentChatId ? " active" : "");
      btn.textContent = chat.title;
      btn.addEventListener("click", () => loadChat(chat.id));
      chatHistoryEl.appendChild(btn);
    });
  }
  function archiveCurrentChat(){
    if (history.length === 0) return; // nothing to save
    const chats = loadChats();
    const firstUserMsg = history.find(m => m.role === "user");
    const title = firstUserMsg ? firstUserMsg.content.slice(0, 40) : "Söhbət";
    if (currentChatId) {
      const idx = chats.findIndex(c => c.id === currentChatId);
      if (idx !== -1) { chats[idx].history = history; chats[idx].title = title; saveChats(chats); return; }
    }
    const id = "chat_" + Date.now();
    chats.push({ id, title, history: [...history] });
    saveChats(chats);
    currentChatId = id;
  }
  function loadChat(id){
    const chats = loadChats();
    const chat = chats.find(c => c.id === id);
    if (!chat) return;
    currentChatId = id;
    history = [...chat.history];
    chatLog.innerHTML = "";
    history.forEach(m => appendMessage(m.role === "user" ? "user" : "bot", m.content));
    renderHistory();
    closeSidebar();
  }
  function startNewChat(){
    archiveCurrentChat();
    currentChatId = null;
    history = [];
    chatLog.innerHTML = "";
    const dict = I18N[currentLang];
    appendMessage("bot", dict.welcome);
    renderHistory();
    closeSidebar();
    chatInput.focus();
  }
  newChatBtn?.addEventListener("click", startNewChat);

  // ---- i18n dictionary ----
  const I18N = {
    az: {
      tagline: "TIKINTI ÜÇÜN SÜNİ İNTELLEKT KÖMƏKÇİSİ",
      hud_status: "SİSTEM AKTİVDİR",
      new_chat: "Yeni söhbət",
      tools_label: "ALƏTLƏR",
      chats_label: "SÖHBƏTLƏR",
      no_chats: "Hələ söhbət yoxdur",
      eyebrow: "Construction Copilot",
      hero_title: "Sahədə lazım olanı saniyələr içində tap.",
      hero_sub: "NCR, QA/QC şablonları, xərc hesablamaları və bilik mərkəzi — hamısı bir yerdə. Aşağıda yazın, IndustrCons AI sizi düzgün alətə yönləndirəcək.",
      mod_docs_title: "IndustrCons Docs",
      mod_docs_sub: "NCR, Risk Assessment, Slump Test və digər formalar. PDF ixracı ilə.",
      mod_est_title: "Cost Estimator",
      mod_est_sub: "Beton, material və əmək xərclərini avtomatik hesabla.",
      mod_kc_title: "Knowledge Center",
      mod_kc_sub: "Tikinti biliyi, standartlar və bələdçilər.",
      go: "AÇ →",
      welcome: 'Salam 👋 Mən IndustrCons AI-yam. Sahədə nə lazımdır? Məsələn: "Sabah beton tökəcəyik" və ya "NCR lazımdır".',
      send: "Göndər",
      whatsapp_link: "WhatsApp Community-ə qoşul",
      contact_label: "Əlaqə",
      placeholder: "Sualınızı yazın..."
    },
    en: {
      tagline: "AI COPILOT FOR CONSTRUCTION",
      hud_status: "SYSTEM ONLINE",
      new_chat: "New chat",
      tools_label: "TOOLS",
      chats_label: "CHATS",
      no_chats: "No chats yet",
      eyebrow: "Construction Copilot",
      hero_title: "Find what you need on-site in seconds.",
      hero_sub: "NCR, QA/QC templates, cost calculations and a knowledge center — all in one place. Type below and IndustrCons AI will route you to the right tool.",
      mod_docs_title: "IndustrCons Docs",
      mod_docs_sub: "NCR, Risk Assessment, Slump Test and other forms, with PDF export.",
      mod_est_title: "Cost Estimator",
      mod_est_sub: "Automatically calculate concrete, material and labor costs.",
      mod_kc_title: "Knowledge Center",
      mod_kc_sub: "Construction knowledge, standards and guides.",
      go: "OPEN →",
      welcome: 'Hi 👋 I\'m IndustrCons AI. What do you need on site? For example: "We\'re pouring concrete tomorrow" or "I need an NCR".',
      send: "Send",
      whatsapp_link: "Join the WhatsApp Community",
      contact_label: "Contact",
      placeholder: "Type your question..."
    }
  };

  function applyLanguage(lang) {
    currentLang = lang;
    const dict = I18N[lang];
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.documentElement.lang = lang;
    chatInput.placeholder = dict.placeholder;
  }

  function appendMessage(role, text) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + (role === "user" ? "user" : "bot");

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? (currentLang === "en" ? "YOU" : "SİZ") : "INDUSTRCONS AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    if (role !== "user") wrap.appendChild(label);
    wrap.appendChild(bubble);
    chatLog.appendChild(wrap);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function appendActionCard(action) {
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const link = document.createElement("a");
    link.href = action.url;
    if (action.url.startsWith("http")) {
      link.target = "_blank";
      link.rel = "noopener";
    }
    const openText = currentLang === "en" ? "Open " : "";
    const azText = currentLang === "en" ? "→ " + openText + moduleLabel(action.module) : "→ " + moduleLabel(action.module) + " açılsın";
    link.textContent = azText;
    link.style.color = "#E8622C";
    link.style.fontWeight = "600";
    link.style.textDecoration = "none";

    bubble.appendChild(link);
    wrap.appendChild(bubble);
    chatLog.appendChild(wrap);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function moduleLabel(mod) {
    const labels = {
      "docs": "IndustrCons Docs",
      "cost-estimator": "Cost Estimator",
      "knowledge": "Knowledge Center"
    };
    return labels[mod] || mod;
  }

  chatForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;

    appendMessage("user", text);
    history.push({ role: "user", content: text });
    chatInput.value = "";
    sendBtn.disabled = true;

    const typingWrap = document.createElement("div");
    typingWrap.className = "msg bot";
    typingWrap.id = "typingIndicator";
    const typingText = currentLang === "en" ? "typing..." : "yazır...";
    typingWrap.innerHTML = '<div class="label">INDUSTRCONS AI</div><div class="bubble">' + typingText + '</div>';
    chatLog.appendChild(typingWrap);
    chatLog.scrollTop = chatLog.scrollHeight;

    const result = await IndustrConsAPI.sendMessage(text, history, currentLang);

    document.getElementById("typingIndicator")?.remove();
    appendMessage("bot", result.reply);
    history.push({ role: "assistant", content: result.reply });

    if (result.action) {
      appendActionCard(result.action);
    }

    archiveCurrentChat();
    renderHistory();

    sendBtn.disabled = false;
    chatInput.focus();
  });

  document.querySelectorAll(".lang-switch button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".lang-switch button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      applyLanguage(btn.dataset.lang);
    });
  });

  applyLanguage("az");
  renderHistory();

  // Support the SearchAction schema: ?q=... prefills and sends the query
  const urlParams = new URLSearchParams(window.location.search);
  const searchQuery = urlParams.get("q");
  if (searchQuery) {
    chatInput.value = searchQuery;
    chatForm.requestSubmit ? chatForm.requestSubmit() : chatForm.dispatchEvent(new Event("submit", { cancelable: true }));
  }
})();

</script>
</body>
</html>
